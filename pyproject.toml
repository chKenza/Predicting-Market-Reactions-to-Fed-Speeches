[project]
name = "fedshock"
version = "0.1.0"
description = "Predicting market reactions to Fed speeches with FOMC-RoBERTa hawkishness scores."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # text / NLP
    "transformers>=4.44",
    "torch>=2.3",
    "nltk>=3.8",
    "datasets>=2.20",
    "gingado>=0.2.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # market data
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    # modelling
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "chronos-forecasting>=2.0",
    # viz
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
